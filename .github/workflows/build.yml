name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Oldest supported runner: the binary then also runs on older distributions (glibc 2.35+).
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packaging/requirements*.txt
      - name: System libraries for Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3 libfontconfig1
      - run: python -m pip install -r packaging/requirements-dev.txt
      - run: python -m pytest -q
      - name: Shell scripts are valid
        run: bash -n install.sh && bash -n uninstall.sh && bash -n packaging/linux/vcam-setup.sh && bash -n packaging/linux/build.sh
      - name: Build release archive
        run: PYTHON=python packaging/linux/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: handtrack-linux
          path: dist/handtrack-linux-*.tar.gz
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/handtrack-linux-*.tar.gz
          generate_release_notes: true
